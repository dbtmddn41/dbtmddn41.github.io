<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500&text=%EC%9C%A0%EC%8A%B9%EC%9A%B0&display=block">
<style>
  :root {
    --bg: #F8F9FA; --ink: #111418; --ink-2: #3E4552; --muted: #646C7B; --line: #E4E7EC;
    --mask: #DDE2EC; --mask-hi: #EEF1F6; --accent: #2443EB;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute; top: -260px; right: -180px; width: 900px; height: 900px;
    background: radial-gradient(closest-side, rgba(36, 67, 235, 0.10), transparent);
  }
  canvas { position: absolute; inset: 0; }
  .text { position: absolute; left: 88px; top: 92px; width: 640px; }
  .mark { display: flex; align-items: center; gap: 14px; color: var(--muted); font-family: "Geist Mono", monospace; font-size: 22px; }
  .mark svg { width: 30px; height: 30px; }
  h1 {
    margin-top: 58px;
    font-size: 92px; font-weight: 600; font-stretch: 90%; letter-spacing: -0.03em; line-height: 1;
  }
  .ko { display: block; margin-top: 18px; color: var(--muted); font-family: "Noto Sans KR", sans-serif; font-size: 40px; font-weight: 500; letter-spacing: 0; }
  .pos { margin-top: 30px; color: var(--ink-2); font-size: 33px; line-height: 1.3; }
  .topics {
    position: absolute; left: 88px; bottom: 84px; width: 700px;
    color: var(--muted); font-family: "Geist Mono", monospace; font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.7;
  }
  .topics b { color: var(--accent); font-weight: 500; }
  /* The photo slot, still masked: 8 × 8 noisy tiles. */
  .photo {
    position: absolute; right: 108px; top: 165px; width: 300px; height: 300px;
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    border-radius: 26px; overflow: hidden;
    box-shadow: 0 0 0 1.5px rgba(17, 20, 24, 0.08), 0 2px 4px rgba(17, 20, 24, 0.05), 0 18px 44px rgba(17, 20, 24, 0.10);
  }
  .photo i {
    background: url("../assets/img/noise.png") 0 0 / 72px 72px, color-mix(in srgb, var(--mask-hi) calc(var(--n) * 100%), var(--mask));
  }
  .photo i.fresh { background: url("../assets/img/noise.png") 0 0 / 72px 72px, color-mix(in srgb, var(--accent) 16%, var(--mask)); }
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="field" width="2400" height="1260" style="width:1200px;height:630px"></canvas>
<div class="text">
  <div class="mark">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <rect x="1" y="4.5" width="10" height="4.5" rx="1.6" fill="#2443EB"/>
      <rect x="12.5" y="4.5" width="6.5" height="4.5" rx="1.6" fill="#DDE2EC"/>
      <rect x="1" y="11" width="6.5" height="4.5" rx="1.6" fill="#DDE2EC"/>
      <rect x="9" y="11" width="10" height="4.5" rx="1.6" fill="#111418"/>
    </svg>
    dbtmddn41.github.io
  </div>
  <h1>Seungwoo Lyu<span class="ko" lang="ko">유승우</span></h1>
  <p class="pos">Undergraduate Researcher,<br>Korea University</p>
</div>
<p class="topics">Multimodal learning <b>·</b> Diffusion models <b>·</b><br>Diffusion language models</p>
<div class="photo" id="photo"></div>
<script>
  // Seeded so the card is the same on every render.
  let seed = 20261022;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  const photo = document.getElementById('photo');
  const fresh = new Set([10, 29, 46]);
  for (let i = 0; i < 64; i++) {
    const t = document.createElement('i');
    t.style.setProperty('--n', rnd().toFixed(2));
    t.style.backgroundPosition = `${Math.round(-rnd() * 72)}px ${Math.round(-rnd() * 72)}px, 0 0`;
    if (fresh.has(i)) t.className = 'fresh';
    photo.appendChild(t);
  }
  // The field around it, as on the page: the photo's tile grid extended outward, partly noisy.
  const c = document.getElementById('field');
  const g = c.getContext('2d');
  g.scale(2, 2);
  const P = { l: 1200 - 108 - 300, t: 165, r: 1200 - 108, b: 165 + 300 };
  const cell = 300 / 8;
  const reach = 5 * cell;
  const smooth = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
  g.fillStyle = 'rgba(52, 78, 156, 0.5)';
  for (let j = -6; j <= 14; j++) {
    for (let i = -6; i <= 14; i++) {
      const x = P.l + i * cell;
      const y = P.t + j * cell;
      const d = Math.hypot(Math.max(P.l - x, 0, x - P.r), Math.max(P.t - y, 0, y - P.b));
      if (d === 0) continue;
      let w = 1 - smooth(d / reach);
      w *= smooth((x - 700) / (cell * 2)); // clear of the text
      if (w < 0.02) continue;
      const off = 0.85 * cell * 0.3;
      g.globalAlpha = w * 0.7;
      g.beginPath();
      g.arc(x + gauss() * off, y + gauss() * off, 1.9, 0, Math.PI * 2);
      g.fill();
    }
  }
</script>
</body>
</html>
